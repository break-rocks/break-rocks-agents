# world-economy: macroeconomy and monetary policy, 8 languages (en, fr, de, es, it, pt, nl, ja).
# Every feed was reachable on 2026-11-01. rights: an honest note, not legal advice.
# Left out: IMF and OECD (403 to bots), Les Echos (403), Banque de France (403), elEconomista (403).
# Eurostat publishes no news-release RSS (only a dataset-update feed: ec.europa.eu/eurostat/api/dissemination/catalogue/rss/en/statistics-update.rss,
# too noisy for events); its releases reach this launch through the press and GDELT.
sources:
  - id: ecb-press
    name: "European Central Bank"
    type: rss
    url: "https://www.ecb.europa.eu/rss/press.html"
    country: EU
    language: en
    category: monetary_policy
    frequency: 1h
    group: "ECB"
    official: true
    rights: "Official. ECB copyright notice allows reproduction with the source acknowledged, except where stated otherwise (verify); no photos."
  - id: ecb-statpress
    name: "European Central Bank (statistics)"
    type: rss
    url: "https://www.ecb.europa.eu/rss/statpress.html"
    country: EU
    language: en
    category: statistics
    frequency: 3h
    group: "ECB"
    official: true
    rights: "Official. Same terms as ECB press releases: reproduction with source acknowledged (verify)."
  - id: insee-indicateurs
    name: "INSEE"
    type: rss
    url: "https://www.insee.fr/fr/flux/1"
    country: FR
    language: fr
    category: statistics
    frequency: 3h
    group: "INSEE"
    official: true
    rights: "Official French statistics office. INSEE publications are reusable under Licence Ouverte / Etalab 2.0 with attribution (\"Source : Insee\") and date."
  - id: insee-publications
    name: "INSEE (publications)"
    type: rss
    url: "https://www.insee.fr/fr/flux/2"
    country: FR
    language: fr
    category: statistics
    frequency: 6h
    group: "INSEE"
    official: true
    rights: "Official. Licence Ouverte / Etalab 2.0, attribution required."
  - id: fed-press
    name: "Federal Reserve"
    type: rss
    url: "https://www.federalreserve.gov/feeds/press_all.xml"
    country: US
    language: en
    category: monetary_policy
    frequency: 1h
    official: true
    rights: "Official US federal work, generally public domain in the US (17 U.S.C. 105); attribute the Federal Reserve Board."
